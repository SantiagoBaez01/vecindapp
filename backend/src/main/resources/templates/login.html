<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<title>Ingresar · Vecindapp</title>
<section>
  <div class="panel">
    <h1>Ingresar</h1>
    <p class="muted">Stub del Turno 1: todavía no hay usuarios en base de datos.</p>
    <div th:if="${param.error}" class="flash flash-error">No se pudo iniciar sesión.</div>
    <div th:if="${param.logout}" class="flash">Sesión cerrada.</div>
    <form th:action="@{/login}" method="post">
      <label for="username">Email</label>
      <input id="username" name="username" type="email" required autofocus/>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required/>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </div>
</section>
</html>
