<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:replace="${title}">Vecindapp</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" th:href="@{/}">Vecindapp</a>
    <nav class="nav-links">
      <a th:href="@{/}">Inicio</a>
      <a th:href="@{/login}">Ingresar</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div th:replace="${content}"></div>
</main>
<footer class="site-footer">
  <div class="wrap">Vecindapp — catálogo de oficios del barrio</div>
</footer>
</body>
</html>
